   }else{
    ctx.globalAlpha=.075;
    for(let col=0;col<COLS;col++){let x=X0+col*CELL;ctx.strokeStyle='#ffefce';ctx.lineWidth=1.2;ctx.strokeRect(x-43,LANES[r]-28,86,56)}
    ctx.globalAlpha=1;
    if(g.enemies.some(e=>e.lane===r&&e.x<300)&&g.active.includes(r)){
     ctx.fillStyle='#ff564a22';ctx.fillRect(243,LANES[r]-29,95,58);
    }
   }
   if(mode==='play'&&g.active.includes(r)&&hover?.row===r&&hover?.col>=0){
    let x=X0+hover.col*CELL,occupied=g.placed.some(u=>u.row===r&&u.col===hover.col),afford=g.spark>=spec(g.sel).cost&&g.cool[g.sel]===0;
    roundPanel(x-43,LANES[r]-29,86,58,8,occupied?'#ff64642c':afford?'#a9fff020':'#fff0a614',occupied?'#ff807f':afford?'#9cf7e6':'#ffbf8c');
    if(!occupied&&afford){ctx.save();ctx.globalAlpha=.45;drawImg(DEF[g.sel].id,x,LANES[r]-18,82,82);ctx.restore()}
   }
  }
  g.placed.slice().sort((a,b)=>a.y-b.y).forEach(u=>paintGuardian(u,t));
  g.enemies.slice().sort((a,b)=>a.lane-b.lane).forEach(e=>paintEnemy(e,t));
  for(const s of g.shots)paintProjectile(s,t);
  for(let p of g.particles){ctx.globalAlpha=Math.min(1,p.life*1.6);ctx.shadowColor=p.color;ctx.shadowBlur=6;rectangle(p.x,p.y,p.size,p.size,p.color)}
  ctx.globalAlpha=1;ctx.shadowBlur=0;
  for(const f of g.floaters){ctx.globalAlpha=Math.min(1,f.life);text(f.label,f.x,f.y,17,f.color,'center');ctx.globalAlpha=1}
  drawHUD(t);
  drawDeck(t);
  // Nonblocking overlays; all combat HUD elements remain clickable.
  if(g.helpTimer>0&&mode==='play'){
   ctx.globalAlpha=Math.min(.94,g.helpTimer/1.4);
   roundPanel(370,150,550,39,9,'#152a3ce5','#b8dab0');
   text('1–4 SELECT A GUARDIAN   •   CLICK A STONE TILE TO DEPLOY',645,170,17,'#f7eac2','center');
   ctx.globalAlpha=1;
  }
  if(g.waveFlash>0&&mode==='play'){
   ctx.globalAlpha=Math.min(.93,g.waveFlash/1.2);
   ribbon(475,154,331,'WAVE '+g.wave+' / '+Math.max(...g.schedule.map(s=>s.wave)));
   ctx.globalAlpha=1;
  }
  if(g.msgTime>0){
   ctx.globalAlpha=Math.min(1,g.msgTime);
   cutPanel(367,149,548,41,'#4c2e42ec','#f4b56e');
   text(g.msg,641,169,17,'#fff1c7','center');ctx.globalAlpha=1;
  }
  if(g.level===10&&g.enemies.some(e=>BOSSES.includes(e.kind))){
   ctx.globalAlpha=.95;roundPanel(431,557,410,30,7,'#4c2347e6','#ffb36c');
   text(g.world===1?'BOSS · THE ASHEN TITAN':g.world===2?'BOSS · GLACIER COLOSSUS':g.world===3?'BOSS · CLOCKWORK TITAN':g.world===4?'BOSS · AMETHYST COLOSSUS':'BOSS · NEXUS OVERLORD',636,572,17,'#ffe9b4','center');ctx.globalAlpha=1;
  }
 }else{
  cutPanel(0,0,W,87,'#19192ddc','#c18e63');
  text('MATHBOUND',42,31,29,'#ffe6a6');text('SIEGE OF THE REALMS  ·  '+realmName(activeWorld).toUpperCase(),42,65,16,'#e1d0cc');
 }
}

function loop(ms){const dt=lastTime?Math.min((ms-lastTime)/1000,.05):0;lastTime=ms;tick(dt);draw(ms);requestAnimationFrame(loop)}
function position(e){let r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*1280/r.width,y:(e.clientY-r.top)*720/r.height}}
canvas.addEventListener('pointermove',e=>{if(mode!=='play')return;const p=position(e),col=Math.round((p.x-X0)/CELL),row=LANES.findIndex(y=>Math.abs(y-p.y)<=36);hover={col:col>=0&&col<9?col:-1,row}});
canvas.addEventListener('pointerleave',()=>hover=null);
canvas.addEventListener('pointerdown',e=>{if(mode!=='play')return;const p=position(e);if(p.y<103){if(p.x>1180)pauseScreen();return}if(p.y>606){if(p.x<678){let i=Math.floor((p.x-13)/166);if(i>=0&&i<4){g.sel=i;sound(480,.055)}}else if(p.x>685&&p.x<911)launch();else if(p.x>913&&p.x<1270)quiz();return}let row=LANES.findIndex(y=>Math.abs(y-p.y)<=36),col=Math.round((p.x-X0)/CELL);if(row>=0)place(row,col)});
window.addEventListener('keydown',e=>{if(e.target?.tagName==='INPUT'||e.target?.tagName==='SELECT')return;if(mode==='quiz')return;if(mode==='play'&&['1','2','3','4'].includes(e.key)){g.sel=Number(e.key)-1;sound(480,.05);return}if(mode==='play'&&(e.key==='m'||e.key==='M'))quiz();else if(mode==='play'&&e.code==='Space'){e.preventDefault();launch()}else if(e.key==='p'||e.key==='P'||e.key==='Escape'){if(mode==='play')pauseScreen();else if(mode==='pause')resume()}});
requestAnimationFrame(loop);
})();
</script></body></html>
